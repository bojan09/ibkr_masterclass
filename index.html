<!doctype html>
<html lang="en" data-theme="dark" data-theme-preference="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080a0f">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta
      name="description"
      content="IBKR Platform Mastery is an independent companion for learning genuine IBKR Desktop and Trader Workstation paper-trading workflows."
    >
    <title>Dashboard · IBKR Platform Mastery</title>
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/lessons.css">
    <link rel="stylesheet" href="./css/simulator.css">
    <link rel="stylesheet" href="./css/responsive.css">
  </head>
  <body>
    <a class="skip-link" href="#page-content">Skip to lesson workspace</a>

    <div class="app-shell">
      <aside class="sidebar" id="app-sidebar" aria-label="IBKR Platform Mastery course navigation">
        <div class="sidebar__header">
          <a class="brand" href="#/dashboard" aria-label="IBKR Platform Mastery dashboard">
            <span class="brand__mark" aria-hidden="true"><i></i><b>IP</b></span>
            <span class="brand__copy"><strong>IBKR</strong><span>Platform Mastery</span></span>
          </a>
          <button class="icon-button sidebar__close" id="sidebar-close" type="button" aria-label="Close navigation">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <div class="sidebar__status" aria-label="Curriculum progress">
          <div class="sidebar__status-row">
            <span>Curriculum progress</span>
            <strong class="tabular" data-shell-progress-value>0%</strong>
          </div>
          <div class="meter" data-shell-progress role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Curriculum progress">
            <span class="meter__fill"></span>
          </div>
          <div class="sidebar__status-meta"><span data-shell-phase>Phase 01</span><span data-shell-completion>0 / 3 lessons</span></div>
        </div>

        <nav class="sidebar__nav" id="sidebar-nav" aria-label="Course sections"></nav>

        <div class="sidebar__footer">
          <span class="environment-badge"><i aria-hidden="true"></i> Learning environment</span>
          <p>Independent educational content.<br>Not affiliated with, endorsed by, or connected to Interactive Brokers.</p>
        </div>
      </aside>

      <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Close navigation" hidden></button>

      <div class="workspace">
        <header class="topbar">
          <div class="topbar__left">
            <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-controls="app-sidebar" aria-expanded="false" aria-label="Open navigation">
              <span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span>
            </button>
            <nav class="breadcrumb" aria-label="Breadcrumb">
              <span id="breadcrumb-section">Learning center</span>
              <i aria-hidden="true">/</i>
              <strong id="breadcrumb-page">Dashboard</strong>
            </nav>
          </div>
          <div class="topbar__right">
            <label class="theme-control" for="theme-select">
              <span>Appearance</span>
              <select id="theme-select" aria-label="Appearance theme">
                <option value="system">System</option>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
              </select>
            </label>
            <span class="data-badge"><i aria-hidden="true"></i> Educational mode</span>
            <span class="sync-status" id="sync-status"><span aria-hidden="true">◇</span> Saved locally</span>
          </div>
        </header>

        <main class="main-content" id="app-main" tabindex="-1">
          <div id="page-content" aria-live="polite" aria-atomic="false"></div>
        </main>
      </div>
    </div>

    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

    <noscript>
      <div class="noscript-message">IBKR Platform Mastery needs JavaScript enabled to run its interactive learning environment.</div>
    </noscript>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
